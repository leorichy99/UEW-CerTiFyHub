<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject|default:"UEW CerTiFyHub" }}</title>
  <style>
    /* Email-safe resets */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; outline: none; text-decoration: none; }
    @media only screen and (max-width: 600px) {
      .container { width: 100% !important; }
      .content { padding: 20px !important; }
      .button { width: 100% !important; }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #FAFAFA; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
  <!-- Wrapper -->
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="background-color: #FAFAFA;">
    <tr>
      <td align="center" style="padding: 40px 0;">
        <!-- Container -->
        <table role="presentation" cellpadding="0" cellspacing="0" width="600" class="container" style="max-width: 600px; width: 100%; background-color: #ffffff; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0;">
          
          <!-- Header / Logo -->
          <tr>
            <td align="center" style="padding: 32px 40px 24px; border-bottom: 2px solid #242576;">
              {% if logo_url %}
              <img src="{{ logo_url }}" alt="UEW Logo" width="64" height="64" style="display: block; margin: 0 auto 16px;">
              {% endif %}
            </td>
          </tr>

          <!-- Content -->
          <tr>
            <td class="content" style="padding: 32px 40px; color: #0f172a; font-size: 15px; line-height: 1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 40px; background-color: #f8fafc; border-top: 1px solid #e2e8f0; text-align: center; color: #64748b; font-size: 12px; line-height: 1.5;">
              <p style="margin: 0 0 8px; font-weight: 600; color: #242576; letter-spacing: 1px;">UEW CERTIFYHUB</p>
              <p style="margin: 0;">&copy; {% now "Y" %} University of Education, Winneba. All Rights Reserved.</p>
              <p style="margin: 4px 0 0; font-size: 11px; color: #94a3b8;">This is an official institutional communication.</p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
